# The R environment in which the book was rendered (an alternative to renv).
# Create with:  mamba env create -f envs/r-conda.yml
# Note: the Bioconda recipe of GenomeInfoDbData downloads its data from
# bioconductor.org after installation; this needs internet access.
name: rnaseq-tutorial-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  - quarto=1.10.20
  - bioconductor-biocversion=3.20.0
  - bioconductor-deseq2=1.46.0
  - bioconductor-apeglm=1.28.0
  - bioconductor-edger=4.4.0
  - bioconductor-limma=3.62.1
  - bioconductor-sva=3.54.0
  - bioconductor-fgsea=1.32.2
  - bioconductor-recount3=1.16.0
  - bioconductor-rtracklayer=1.66.0
  - bioconductor-genomicfeatures=1.58.0
  - bioconductor-txdbmaker=1.2.0
  - bioconductor-summarizedexperiment=1.36.0
  - r-msigdbr=7.5.1       # bundles MSigDB gene sets; newer versions download them
  - r-ggplot2=4.0.3
  - r-ggrepel=0.9.8
  - r-pheatmap=1.0.13
  - r-patchwork=1.3.2
  - r-dplyr=1.2.1
  - r-tidyr=1.3.2
  - r-tibble=3.3.1
  - r-scales=1.4.0
  - r-knitr=1.52
  - r-rmarkdown=2.32
  - r-renv=1.3.1
  - r-biocmanager=1.30.27
